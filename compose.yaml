services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: venue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venue_local}
      POSTGRES_DB: venue
    ports: ["127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue -d venue"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://venue:${POSTGRES_PASSWORD:-venue_local}@db:5432/venue
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-local-demo-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:${RESTAURANT_DEV_PORT:-5173}:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
