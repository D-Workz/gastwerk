# Docker's embedded DNS tracks service addresses when containers are recreated.
upstream venue_api {
    zone venue_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server api:3001 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://venue_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
